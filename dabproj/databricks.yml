# This is a Declarative Automation Bundle definition for dabproj.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproj
  uuid: fa99aa50-f7ab-4424-b9b0-80815edec090

include:
  - resources/**/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: devs

  schema:
    default: ansh

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
       name_prefix: dev_${workspace.current_user.short_name}
       source_linked_deployment : false

    workspace:
      host: https://dbc-6f864fc6-6e16.cloud.databricks.com
      root_path: /Workspace/Users/ajayvanam15@gmail.com/dev/.bundle/${bundle.name}/${bundle.target}  
  
  prod:
    mode: production
    workspace:
      host: https://dbc-6f864fc6-6e16.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ajayvanam15@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ajayvanam15@gmail.com/prod/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: prod_${workspace.current_user.short_name}
      source_linked_deployment : false
    permissions:
      - group_name: admins
        level: CAN_MANAGE
